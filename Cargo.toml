[workspace]
resolver = "2"
members = ["backend/aoc-core", "backend/aocd", "backend/aocctl"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["Narendra Hindwar <hindwarnarendra@gmail.com>"]
repository = "https://github.com/narendra5155/acer-open-control"
homepage = "https://github.com/narendra5155/acer-open-control"
rust-version = "1.75"

[workspace.dependencies]
aoc-core = { path = "backend/aoc-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
log = "0.4"
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
signal-hook = "0.3"

[profile.release]
lto = true
codegen-units = 1
strip = true
